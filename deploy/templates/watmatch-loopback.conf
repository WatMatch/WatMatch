# Private preview only. No public listener and no TLS change.
# This site file is included from Nginx's http context. Never log auth queries.
log_format watmatch_private '$remote_addr [$time_local] "$request_method $uri" '
                           '$status $body_bytes_sent rt=$request_time';
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/watmatch-loopback.access.log watmatch_private;
    # Private preview only: upstream errors can otherwise persist Clerk JWT queries.
    # Sanitized access events and global startup/systemd diagnostics remain available.
    error_log /dev/null;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
